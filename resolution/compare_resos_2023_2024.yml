inputs:
    dirname: null # leave null if not common for all input files
    filenames: [
                /home/mdicosta/alice/hf-vn/resolution/reso_2023_allruns/resosp2023_allruns.root,
                /home/mdicosta/alice/hf-vn/resolution/reso_2024_allruns/resosp2024_allruns.root,
                ]
    objectnames: [reso_all_cents_FT0c_FV0a_TPCtot, reso_all_cents_FT0c_FV0a_TPCtot]

output: 
    filename: /home/mdicosta/alice/hf-vn/resolution/reso_2023_2024 # with path and w/o extension
    extensions: [pdf] # possibilities: pdf, eps, png, root

options:
    ROOTobject: [TH1, TH1] # TH1 or TGraph: no need to specify TH1F, TH1D or TGraphErrors, TGraphAsymmErrors
    scale: [1., 1.]
    lambdaParams: [1., 1.] # counts -> (counts - 1) * lambda + 1
    normalize: [false, false] # divide histogram by its area
    colors: [kRed+1, kAzure+4]
    markers: [kFullCircle, kFullCircle]
    markersize: 1.5
    linewidth: 2
    fillstyle: [1,1]
    fillalpha: [1,1]
    drawopt: [hist, hist]
    
    ratio:
        enable: true
        uncertainties:
            enable: false
            corr: false
        displayRMS: true
        multiRatio: false
        indexNumerator: [0, 2]
        indexDenominator: [1, 3]

    text:
        x: [0.6, 0.8]
        y: [0.6, 0.9]
        text: ""
        textsize: 0.04
        textfont: 42
        textalign: 12

    errcomp: # comparison of uncertainties
        enable: false
        relative: false

    legend:
        avoid: false #set true to avoid the legend in the final plot
        xlimits: [0.50, 0.70]
        ylimits: [0.35, 0.55]
        header: ''
        titles: ['2023', '2024']
        options: [lp, lp]
        textsize: 0.045
        ncolumns: 1

    canvas:
        width: 1600
        heigth: 800
        xaxistitle: 'Cent'
        yaxistitle: 'R2'
        xlimits: [0, 80.]
        ylimits: [0.2, 0.85]
        ylimitsratio: [0.7, 1.01]
        ylimitserr: [0.00000001, 5]
        logy: false
        logx: false
        ratio:
            logy: false
            logx: false
        errcomp:
            logy: false
            logx: false  

DrawGrid: True